<html lang="en">
<head>

<body class="rc-page"><main class="rc-phone">
  <div class="rc-status"><span data-current-time>9:30</span><span class="rc-island" aria-hidden="true"></span><span class="rc-status-right">▮▮▮　◉　▰</span></div>
  <header class="rc-topbar"><a class="rc-icon-button" href="./collector-home-dashboard.html" aria-label="Back">‹</a><h1>Collection &amp; Confirm</h1><span class="rc-top-tag">Record weights</span></header>

  <form id="weigh-confirm-form" class="rc-card">
    <label for="arrived-pickup">Arrived pickup</label><select id="arrived-pickup" class="rc-form-input" required></select>
    <h2 class="rc-section-title">Material weights</h2><div id="weight-fields" class="rc-weight-fields"></div>

    <button class="rc-button block" type="submit">Save weights to pickup</button>
  </form>
  <p class="rc-small-note">The backend calculates the payout using its current rates, credits the household wallet, and requests household confirmation.</p>

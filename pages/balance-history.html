
<!DOCTYPE html>

    <!-- Balance -->
    <section class="mb-5 text-center">
      <p class="text-sm text-slate-500">Available Balance</p>
      <h2 id="history-points"
    class="mt-1 text-4xl font-extrabold tracking-tight text-slate-900">
  0 <span class="text-xl font-semibold">Points</span>
</h2>

      <div class="mt-5 grid grid-cols-2 gap-3">

        <button
          id="redeem-button"
          class="flex items-center justify-center gap-2 rounded-xl bg-green-700 px-3 py-3 text-xs font-bold text-white shadow-sm transition hover:bg-green-800 active:scale-95"
        >
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 7H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2Z"/>
            <path d="M16 7V5a4 4 0 0 0-8 0v2m4 5v4"/>
          </svg>
          Redeem Rewards
        </button>

        <div class="flex items-center justify-center gap-2 rounded-xl border border-slate-300 bg-white px-3 py-2">
          <div class="text-left">
            <p class="text-[10px] text-slate-500">Balance</p>
            <p id="history-naira" class="text-sm font-bold text-slate-800">₦0</p>
          </div>
        </div>

      </div>
    </section>

    <!-- History -->
    <section class="flex-1">

      <div class="mb-3">
        <h2 class="text-lg font-bold text-slate-900">History</h2>
        <p class="text-xs text-slate-500">Your recycling and rewards activity</p>
      </div>

      <!-- This Week -->
      <div class="mb-5">
        <h3 class="mb-3 text-sm font-semibold text-slate-700">This Week</h3>

        <div class="space-y-2">

          <!-- Recent Pickup -->
          <article class="flex items-center gap-3 rounded-2xl border border-slate-200 bg-white p-3 shadow-sm">
            <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-green-50 text-green-700">
               <svg xmlns="http://www.w3.org/2000/svg"
     width="26" height="26" viewBox="0 0 24 24"
     fill="none" stroke="currentColor"
     stroke-width="1.8" stroke-linecap="round"
     stroke-linejoin="round">
  <path d="M10 17h4V5H2v12h3"/>
  <path d="M14 9h4l4 4v4h-3"/>
  <circle cx="7.5" cy="17.5" r="2.5"/>
  <circle cx="17.5" cy="17.5" r="2.5"/>
</svg>
            </div>

            <div class="min-w-0 flex-1">
              <h4 class="text-sm font-semibold text-slate-800">Recent Pickup</h4>
              <p class="mt-1 text-xs text-slate-400">3 days ago</p>
            </div>

            <p class="whitespace-nowrap text-sm font-bold text-green-600">+50 Points</p>
          </article>

          <!-- Reward Redeemed -->
          <article class="flex items-center gap-3 rounded-2xl border border-slate-200 bg-white p-3 shadow-sm">
            <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-amber-50 text-amber-600">
               <svg xmlns="http://www.w3.org/2000/svg"
     class="text-green-600"
     width="25" height="25"
     viewBox="0 0 24 24"
     fill="none" stroke="currentColor"
     stroke-width="1.8"
     stroke-linecap="round"
     stroke-linejoin="round">
  <circle cx="12" cy="8" r="6"/>
  <path d="m8.21 13-1.5 8L12 18l5.29 3-1.5-8"/>
  <path d="m9 8 2 2 4-4"/>
</svg> 
            </div>

            <div class="min-w-0 flex-1">
              <h4 class="text-sm font-semibold text-slate-800">Reward Redeemed</h4>
              <p class="mt-1 text-xs text-slate-400">5 days ago</p>
            </div>

            <p class="whitespace-nowrap text-sm font-bold text-red-500">-300 Points</p>
          </article>

          <!-- Bottle Return -->
          <article class="flex items-center gap-3 rounded-2xl border border-slate-200 bg-white p-3 shadow-sm">
            <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-amber-50 text-amber-600">
              🍼
            </div>

            <div class="min-w-0 flex-1">
              <h4 class="text-sm font-semibold text-slate-800">Bottle Return</h4>
              <p class="mt-1 text-xs text-slate-400">1 week ago</p>
            </div>

            <p class="whitespace-nowrap text-sm font-bold text-green-600">+15 Points</p>
          </article>

        </div>
      </div>

      <!-- Last Month -->
      <div class="mb-5">
        <h3 class="mb-3 text-sm font-semibold text-slate-700">Last Month</h3>

        <article class="flex items-center gap-3 rounded-2xl border border-slate-200 bg-white p-3 shadow-sm">
          <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-green-50 text-green-700">
             <svg xmlns="http://www.w3.org/2000/svg"
     width="26" height="26" viewBox="0 0 24 24"
     fill="none" stroke="currentColor"
     stroke-width="1.8" stroke-linecap="round"
     stroke-linejoin="round">
  <path d="M10 17h4V5H2v12h3"/>
  <path d="M14 9h4l4 4v4h-3"/>
  <circle cx="7.5" cy="17.5" r="2.5"/>
  <circle cx="17.5" cy="17.5" r="2.5"/>
</svg>
          </div>

          <div class="min-w-0 flex-1">
            <h4 class="text-sm font-semibold text-slate-800">One-Off Pickup</h4>
            <p class="mt-1 text-xs text-slate-400">2 weeks ago</p>
          </div>

          <p class="whitespace-nowrap text-sm font-bold text-green-600">+200 Points</p>

          
        </article>
      </div>
      

    </section>

    <!-- Bottom Navigation -->
   <nav id="bottom-navigation"
     class="mt-auto grid grid-cols-4 border-t border-slate-200 bg-[#f8faf7] pt-3">
</nav>

<script type="module">
  import { renderBottomNavigation } from "../src/js/components/bottom-navigation.js";

  renderBottomNavigation();
</script>
  </main>

  <script>
  // Load wallet information
  const wallet = JSON.parse(
    localStorage.getItem("recycleconnect_wallet") ||
    '{"balance":0,"points":0}'
  );

  document.getElementById("history-points").innerHTML =
    `${Number(wallet.points || 0).toLocaleString()}
     <span class="text-xl font-semibold">Points</span>`;

  document.getElementById("history-naira").textContent =
    `₦${Number(wallet.balance || 0).toLocaleString()}`;

  // Load pickup history
  const history = JSON.parse(
    localStorage.getItem("recycleconnect_history") || "[]"
  );

  const historyList = document.getElementById("history-list");

  function getActivityDate(item) {
    const value = item.createdAt || item.date;

    if (!value) return null;

    const date = new Date(
      /^\d{4}-\d{2}-\d{2}$/.test(value)
        ? `${value}T00:00:00`
        : value
    );

    return Number.isNaN(date.getTime()) ? null : date;
  }

  function renderHistory() {
    historyList.innerHTML = "";

    if (!history.length) {
      historyList.innerHTML = `
        <div class="rounded-2xl border border-slate-200 bg-white p-6 text-center">
          <p class="text-sm font-semibold text-slate-700">
            No activity yet
          </p>
          <p class="mt-1 text-xs text-slate-400">
            Your recycling activity will appear here.
          </p>
        </div>
      `;
      return;
    }

    const sortedHistory = [...history].sort((a, b) => {
      return (getActivityDate(b)?.getTime() || 0) -
             (getActivityDate(a)?.getTime() || 0);
    });

    const now = new Date();
    const weekAgo = new Date();
    weekAgo.setDate(now.getDate() - 7);

    const groups = [
      {
        title: "This Week",
        items: sortedHistory.filter(item => {
          const date = getActivityDate(item);
          return date && date >= weekAgo;
        })
      },
      {
        title: "Earlier Activity",
        items: sortedHistory.filter(item => {
          const date = getActivityDate(item);
          return !date || date < weekAgo;
        })
      }
    ];

    groups.forEach(group => {
      if (!group.items.length) return;

      const section = document.createElement("div");
      section.className = "mb-5";

      const heading = document.createElement("h3");
      heading.className = "mb-3 text-sm font-semibold text-slate-700";
      heading.textContent = group.title;

      const cards = document.createElement("div");
      cards.className = "space-y-2";

      group.items.forEach(item => {
        const card = document.createElement("article");
        card.className =
          "flex items-center gap-3 rounded-2xl border border-slate-200 bg-white p-3 shadow-sm";

        const icon = document.createElement("div");
        icon.className =
          "flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-green-50 text-green-700";
        icon.textContent = "♻️";

        const details = document.createElement("div");
        details.className = "min-w-0 flex-1";

        const title = document.createElement("h4");
        title.className = "text-sm font-semibold text-slate-800";
        title.textContent = item.material
          ? `${item.material} Pickup`
          : "Pickup Request";

        const date = document.createElement("p");
        date.className = "mt-1 text-xs text-slate-400";

        const activityDate = getActivityDate(item);
        date.textContent = activityDate
          ? activityDate.toLocaleDateString()
          : "Date unavailable";

        const status = document.createElement("p");
        status.className =
          "whitespace-nowrap text-xs font-semibold text-green-700";
        status.textContent = item.status || "Recorded";

        details.append(title, date);
        card.append(icon, details, status);
        cards.appendChild(card);
      });

      section.append(heading, cards);
      historyList.appendChild(section);
    });
  }

  renderHistory();

  document.getElementById("redeem-button").addEventListener("click", () => {
    alert("Rewards redemption will be available when the Rewards section is connected.");
  });
</script>
</body>
</html>

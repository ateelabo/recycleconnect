
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balance History | RecycleConnect</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body class="min-h-screen bg-[#f8faf7] text-slate-800">

  <main class="mx-auto flex min-h-screen w-full max-w-md flex-col px-5 pb-32 pt-5">

    <!-- Header -->
    <header class="relative mb-5 flex items-center justify-center">
      <a href="./household-dashboard.html"
         aria-label="Go back"
         class="absolute left-0 flex h-9 w-9 items-center justify-center rounded-full text-green-700 hover:bg-green-50">
        <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m15 18-6-6 6-6"/>
        </svg>
      </a>

      <h1 class="text-base font-semibold text-slate-800">Balance History</h1>
    </header>

    <!-- Balance -->
    <section class="mb-5 text-center">
      <p class="text-sm text-slate-500">Available Balance</p>
      <h2 id="history-points"
    class="mt-1 text-4xl font-extrabold tracking-tight text-slate-900">
  0 <span class="text-xl font-semibold">Points</span>
</h2>

      <div class="mt-5 grid grid-cols-2 gap-3">

        <button
          id="redeem-button"
          class="flex items-center justify-center gap-2 rounded-xl bg-green-700 px-3 py-3 text-xs font-bold text-white shadow-sm transition hover:bg-green-800 active:scale-95"
        >
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 7H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2Z"/>
            <path d="M16 7V5a4 4 0 0 0-8 0v2m4 5v4"/>
          </svg>
          Redeem Rewards
        </button>

        <div class="flex items-center justify-center gap-2 rounded-xl border border-slate-300 bg-white px-3 py-2">
          <div class="text-left">
            <p class="text-[10px] text-slate-500">Balance</p>
            <p id="history-naira" class="text-sm font-bold text-slate-800">₦0</p>
          </div>
        </div>

      </div>
    </section>

    <!-- History -->
<section class="flex-1">

  <div class="mb-3">
    <h2 class="text-lg font-bold text-slate-900">History</h2>
    <p class="text-xs text-slate-500">
      Your recycling and rewards activity
    </p>
  </div>

  <!-- Dynamic History -->
  <div id="history-list"
        class="custom-scrollbar max-h-96 space-y-5 overflow-y-auto overscroll-contain pr-2">

    <div class="rounded-2xl border border-slate-200 bg-white p-6 text-center">
      <p class="text-sm font-semibold text-slate-700">
        No activity yet
      </p>
      <p class="mt-1 text-xs text-slate-400">
        Your recycling activity will appear here.
      </p>
    </div>

  </div>

</section>

<!-- Redeem Rewards Modal -->
<div id="redeem-modal"
     class="fixed inset-0 z-[100] hidden items-center justify-center bg-slate-900/50 px-5">

  <div class="w-full max-w-sm rounded-3xl bg-white p-6 shadow-xl">

    <div class="mb-5 flex items-center justify-between">
      <h2 class="text-lg font-bold text-slate-900">
        Redeem Rewards
      </h2>

      <button id="close-redeem"
              type="button"
              class="flex h-9 w-9 items-center justify-center rounded-full bg-slate-100 text-slate-600">
        ✕
      </button>
    </div>

    <div class="mb-5 rounded-2xl bg-green-50 p-5 text-center">
      <p class="text-xs font-medium text-green-700">
        Available Points
      </p>

      <h3 id="redeem-available-points"
          class="mt-2 text-3xl font-extrabold text-green-800">
        0
      </h3>

      <p class="mt-1 text-xs text-green-700">
        1 Point = ₦1
      </p>
    </div>

    <form id="redeem-form" class="space-y-4">

      <div>
        <label for="redeem-points"
               class="mb-2 block text-sm font-semibold text-slate-700">
          Points to Redeem
        </label>

        <input id="redeem-points"
               type="number"
               min="1"
               step="1"
               required
               placeholder="Enter points"
               class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-green-600">
      </div>

      <div class="rounded-xl bg-slate-50 p-4">
        <p class="text-xs text-slate-500">You will receive</p>

        <p id="redeem-naira"
           class="mt-1 text-2xl font-extrabold text-slate-900">
          ₦0
        </p>
      </div>

      <p id="redeem-message"
         class="hidden text-sm font-medium">
      </p>

      <button type="submit"
              class="w-full rounded-xl bg-green-700 py-3 text-sm font-bold text-white transition hover:bg-green-800">
        Confirm Redemption
      </button>

    </form>

    <p class="mt-4 text-center text-[10px] text-slate-400">
      Demo redemption. Real payouts require backend integration.
    </p>

  </div>
</div>
    <!-- Bottom Navigation -->
   <nav id="bottom-navigation"
     class="fixed bottom-0 left-0 z-50 grid w-full grid-cols-4 border-t border-slate-200 bg-[#f8faf7] px-4 pt-3 pb-[env(safe-area-inset-bottom)] shadow-[0_-4px_15px_rgba(0,0,0,0.04)]">
</nav>

<script type="module">
  import { renderBottomNavigation } from "../src/js/components/bottom-navigation.js";

  renderBottomNavigation();
</script>
  </main>

  <script>
  // Load wallet information
  let wallet = JSON.parse(
  localStorage.getItem("recycleconnect_wallet") ||
  '{"balance":0,"points":0}'
);

wallet.balance = Number(wallet.balance || 0);
wallet.points = Number(wallet.points || 0);

  document.getElementById("history-points").innerHTML =
    `${Number(wallet.points || 0).toLocaleString()}
     <span class="text-xl font-semibold">Points</span>`;

  document.getElementById("history-naira").textContent =
    `₦${Number(wallet.balance || 0).toLocaleString()}`;

  // Load pickup history
  const history = JSON.parse(
    localStorage.getItem("recycleconnect_history") || "[]"
  );

  const historyList = document.getElementById("history-list");

  function getActivityDate(item) {
    const value = item.createdAt || item.date;

    if (!value) return null;

    const date = new Date(
      /^\d{4}-\d{2}-\d{2}$/.test(value)
        ? `${value}T00:00:00`
        : value
    );

    return Number.isNaN(date.getTime()) ? null : date;
  }

  function renderHistory() {
    historyList.innerHTML = "";

    if (!history.length) {
      historyList.innerHTML = `
        <div class="rounded-2xl border border-slate-200 bg-white p-6 text-center">
          <p class="text-sm font-semibold text-slate-700">
            No activity yet
          </p>
          <p class="mt-1 text-xs text-slate-400">
            Your recycling activity will appear here.
          </p>
        </div>
      `;
      return;
    }

    const sortedHistory = [...history].sort((a, b) => {
      return (getActivityDate(b)?.getTime() || 0) -
             (getActivityDate(a)?.getTime() || 0);
    });

    const now = new Date();
    const weekAgo = new Date();
    weekAgo.setDate(now.getDate() - 7);

    const groups = [
      {
        title: "This Week",
        items: sortedHistory.filter(item => {
          const date = getActivityDate(item);
          return date && date >= weekAgo;
        })
      },
      {
        title: "Earlier Activity",
        items: sortedHistory.filter(item => {
          const date = getActivityDate(item);
          return !date || date < weekAgo;
        })
      }
    ];

    groups.forEach(group => {
      if (!group.items.length) return;

      const section = document.createElement("div");
      section.className = "mb-5";

      const heading = document.createElement("h3");
      heading.className = "mb-3 text-sm font-semibold text-slate-700";
      heading.textContent = group.title;

      const cards = document.createElement("div");
      cards.className = "space-y-2";

      group.items.forEach(item => {
        const card = document.createElement("article");
        card.className =
          "flex items-center gap-3 rounded-2xl border border-slate-200 bg-white p-3 shadow-sm";

        const icon = document.createElement("div");
        icon.className =
          "flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-green-50 text-green-700";
        icon.textContent = "♻️";

        const details = document.createElement("div");
        details.className = "min-w-0 flex-1";

        const title = document.createElement("h4");
        title.className = "text-sm font-semibold text-slate-800";
        title.textContent = item.title || (
  item.material ? `${item.material} Pickup` : "Pickup Request"
);

        const date = document.createElement("p");
        date.className = "mt-1 text-xs text-slate-400";

        const activityDate = getActivityDate(item);
        date.textContent = activityDate
          ? activityDate.toLocaleDateString()
          : "Date unavailable";

        const status = document.createElement("p");
        status.className =
          "whitespace-nowrap text-xs font-semibold text-green-700";
        status.textContent = item.points !== undefined
  ? `${item.points > 0 ? "+" : ""}${item.points} Points`
  : item.status || "Recorded";

        details.append(title, date);
        card.append(icon, details, status);
        cards.appendChild(card);
      });

      section.append(heading, cards);
      historyList.appendChild(section);
    });
  }

  renderHistory();

 // Rewards Redemption
const redeemModal = document.getElementById("redeem-modal");
const redeemInput = document.getElementById("redeem-points");
const redeemAvailable = document.getElementById("redeem-available-points");
const redeemNaira = document.getElementById("redeem-naira");
const redeemMessage = document.getElementById("redeem-message");

// Open modal
document.getElementById("redeem-button").addEventListener("click", () => {
  redeemAvailable.textContent = wallet.points.toLocaleString();
  redeemInput.value = "";
  redeemNaira.textContent = "₦0";
  redeemMessage.classList.add("hidden");

  redeemModal.classList.remove("hidden");
  redeemModal.classList.add("flex");
});

// Close modal
document.getElementById("close-redeem").addEventListener("click", () => {
  redeemModal.classList.add("hidden");
  redeemModal.classList.remove("flex");
});

// Calculate Naira value
redeemInput.addEventListener("input", () => {
  const points = Number(redeemInput.value);

  redeemNaira.textContent =
    `₦${(points > 0 ? points : 0).toLocaleString()}`;
});

// Confirm redemption
document.getElementById("redeem-form").addEventListener("submit", (event) => {
  event.preventDefault();

  const points = Number(redeemInput.value);

  if (!Number.isInteger(points) || points <= 0) {
    alert("Please enter a valid number of points.");
    return;
  }

  if (points > wallet.points) {
    alert("You don't have enough points.");
    return;
  }

  // Deduct points and credit Naira balance
  wallet.points -= points;
  wallet.balance += points;

  localStorage.setItem(
    "recycleconnect_wallet",
    JSON.stringify(wallet)
  );

  // Record transaction
 history.push({
  title: "Reward Redeemed",
  points: -points,
  status: "Redeemed",
  createdAt: new Date().toISOString()
});

  localStorage.setItem(
    "recycleconnect_history",
    JSON.stringify(history)
  );

  // Update displayed wallet
  document.getElementById("history-points").innerHTML =
    `${wallet.points.toLocaleString()}
     <span class="text-xl font-semibold">Points</span>`;

  document.getElementById("history-naira").textContent =
    `₦${wallet.balance.toLocaleString()}`;

  redeemModal.classList.add("hidden");
  redeemModal.classList.remove("flex");

  alert(`Successfully redeemed ${points} points for ₦${points.toLocaleString()}!`);

  renderHistory();
});
</script>
<script src="../src/js/config/config.js"></script>
<script src="../src/js/api.js"></script>
<script src="../src/js/integration.js"></script>
</body>
</html>

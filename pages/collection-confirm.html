<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f5">
  <title>Collection &amp; Confirm | Recycle Connect</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/design-continuation.css">
</head>
<body class="rc-page">
  <main class="rc-phone">
    <div class="rc-status"><span data-current-time>9:30</span><span class="rc-island" aria-hidden="true"></span><span class="rc-status-right">▮▮▮　◉　▰</span></div>
    <header class="rc-topbar"><a class="rc-icon-button" href="./household-dashboard.html" aria-label="Back to household dashboard">‹</a><h1>Collection &amp; Confirm</h1><button class="rc-bell" type="button" data-notice="You’re all caught up." aria-label="Notifications">♧</button></header>
    <section class="rc-card rc-soft-card"><h2>Review your pickup</h2><p class="rc-subtitle" style="margin-top:12px">The details below are loaded from your account. Confirm them or send a dispute for admin review.</p></section>
    <p id="confirmation-notice" class="rc-small-note" role="status" aria-live="polite">Loading pickup confirmation…</p>
    <section id="confirmation-details" class="rc-card" aria-live="polite"></section>
    <section id="confirmation-actions" class="rc-button-row"><button id="confirm-pickup" class="rc-button" type="button">👍 Confirm pickup</button><button id="dispute-pickup" class="rc-button danger" type="button">👎 Report an issue</button></section>
    <section id="dispute-form" class="rc-card" hidden><label for="dispute-reason">What needs review?</label><textarea id="dispute-reason" rows="3" class="rc-form-input" maxlength="1000"></textarea><button id="submit-dispute" class="rc-button danger block" type="button">Send dispute</button></section>
    <nav class="rc-nav" aria-label="Household navigation"><a class="active" href="./household-dashboard.html"><span class="rc-nav-icon">⌂</span>Home</a><a href="./balance-history.html"><span class="rc-nav-icon">◴</span>History</a><a href="./rewards.html"><span class="rc-nav-icon">♙</span>Reward</a><a href="./profile-settings.html"><span class="rc-nav-icon">♟</span>Profile</a></nav>
    <div class="rc-toast" data-toast hidden role="status" aria-live="polite"></div>
  </main>
  <script src="../src/js/config/config.js"></script><script src="../src/js/api.js"></script><script src="../src/js/live-design-screens.js"></script><script src="../src/js/design-continuation.js"></script>
</body>
</html>

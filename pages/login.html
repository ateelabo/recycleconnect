
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#16a34a">
  <title>Login | RecycleConnect</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body class="min-h-screen bg-gradient-to-br from-green-50 to-emerald-100 text-slate-800">

  <main class="flex min-h-screen items-center justify-center px-5 py-10">

    <section class="w-full max-w-md rounded-3xl bg-white p-7 shadow-xl sm:p-9">

        <!-- Back Button - Top Left -->
<div class="mb-5 flex justify-start">
  <button
    type="button"
    onclick="history.back()"
    class="inline-flex items-center gap-2 text-sm font-semibold text-green-700 transition hover:text-green-900"
  >
    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24"
      stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M19 12H5m7-7-7 7 7 7"/>
    </svg>
    Back
  </button>
</div>

      <!-- Logo -->
      <div class="mb-7 text-center">
        <div class="mx-auto mb-3 flex h-16 w-16 items-center justify-center ">
          <span class="text-4xl">♻️</span>
        </div>

        <h1 class="text-2xl font-extrabold text-green-700">
          Recycle Connect
        </h1>

        <h2 class="mt-5 text-xl font-bold text-slate-800">
          Welcome Back!
        </h2>

        <p class="mt-2 text-sm text-slate-500">
          Sign in with your email and password or continue with Google.
        </p>

        <p id="role-label" class="mt-3 text-xs font-semibold text-green-700"></p>
      </div>

      <!-- Login form -->
      <form id="login-form" class="space-y-5">

        <div>
          <label for="identity" class="mb-2 block text-sm font-semibold">
            Email or Phone Number
          </label>

          <input
            id="identity"
            type="text"
            placeholder="Enter your email or phone number"
            autocomplete="username"
            required
            class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm outline-none transition focus:border-green-500 focus:ring-2 focus:ring-green-100"
          >
        </div>

        <div>
          <div class="mb-2 flex items-center justify-between">
            <label for="password" class="text-sm font-semibold">
              Password
            </label>
          </div>

          <div class="relative">
            <input
              id="password"
              type="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
              class="w-full rounded-xl border border-slate-300 px-4 py-3 pr-16 text-sm outline-none transition focus:border-green-500 focus:ring-2 focus:ring-green-100"
            >

            
            <button
            type="button"
            id="toggle-password"
            aria-label="Show password"
            aria-pressed="false"
            class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-green-700"
            >
            <!-- Eye icon -->
            <svg id="eye-open" xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round"
                d="M2.5 12s3.5-7 9.5-7 9.5 7 9.5 7-3.5 7-9.5 7-9.5-7-9.5-7Z"/>
                <circle cx="12" cy="12" r="3"/>
            </svg>

            <!-- Eye-off icon -->
            <svg id="eye-closed" xmlns="http://www.w3.org/2000/svg"
                class="hidden h-5 w-5" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round"
                d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
                <path stroke-linecap="round" stroke-linejoin="round"
                d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6 0 9.5 7 9.5 7a16 16 0 0 1-3.2 4.1M6.2 6.2C3.8 7.8 2.5 12 2.5 12s3.5 7 9.5 7c1.1 0 2.1-.2 3-.5"/>
            </svg>
            </button>

          </div>

          <div class="mt-2 text-right">
            <a href="#" id="forgot-link"
              class="text-xs font-semibold text-green-700 hover:underline">
              Forgot Password?
            </a>
          </div>
        </div>

        <button
          type="submit"
          class="w-full rounded-xl bg-green-600 py-3.5 font-bold text-white shadow-md transition hover:bg-green-700 active:scale-95"
        >
          Sign In
        </button>

        <p id="login-message" class="text-center text-xs text-slate-500" aria-live="polite"></p>

      </form>

      <!-- Divider -->
      <div class="my-6 flex items-center gap-3">
        <div class="h-px flex-1 bg-slate-200"></div>
        <span class="text-xs text-slate-400">OR</span>
        <div class="h-px flex-1 bg-slate-200"></div>
      </div>

      <!-- Google button -->
      <button
        type="button"
        id="google-button"
        class="flex w-full items-center justify-center gap-3 rounded-xl border border-slate-300 py-3 text-sm font-semibold transition hover:bg-slate-50"
      >
        
<svg class="h-5 w-5" viewBox="0 0 48 48" aria-hidden="true">
  <path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.6c3.9-3.6 6.1-8.9 6.1-15z"/>
  <path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.9l-6.6-5.1c-1.8 1.2-4.1 2-6.9 2-5.3 0-9.8-3.6-11.4-8.4H5.8v5.3A20 20 0 0 0 24 44z"/>
  <path fill="#FBBC05" d="M12.6 27.6a12 12 0 0 1 0-7.2v-5.3H5.8a20 20 0 0 0 0 17.8z"/>
  <path fill="#EA4335" d="M24 12.1c3 0 5.7 1 7.8 3.1l5.8-5.8C34.1 6.1 29.5 4 24 4A20 20 0 0 0 5.8 15.1l6.8 5.3c1.6-4.7 6.1-8.3 11.4-8.3z"/>
</svg>

        Continue with Google
      </button>

      <!-- Signup link -->
      <p class="mt-7 text-center text-sm text-slate-500">
        Don't have an account?
        <a href="./signup.html" id="signup-link"
          class="font-bold text-green-700 hover:underline">
          Sign Up
        </a>
      </p>

    </section>

  </main>

  
<script>
  // Navigate to Sign Up without a role parameter
  document.getElementById("signup-link").href = "./signup.html";

  // Show / hide password
  const password = document.getElementById("password");
  const toggleButton = document.getElementById("toggle-password");

  const eyeOpen = document.getElementById("eye-open");
  const eyeClosed = document.getElementById("eye-closed");

  toggleButton.addEventListener("click", () => {
    const isHidden = password.type === "password";

    password.type = isHidden ? "text" : "password";

    eyeOpen.classList.toggle("hidden", !isHidden);
    eyeClosed.classList.toggle("hidden", isHidden);

    toggleButton.setAttribute(
      "aria-label",
      isHidden ? "Hide password" : "Show password"
    );

    toggleButton.setAttribute("aria-pressed", String(isHidden));
  });

  // The shared integration script submits the credentials to the API.
  document.getElementById("login-form").addEventListener("submit", (event) => {
    event.preventDefault();

    document.getElementById("login-message").textContent =
      "Use your email or phone and password to sign in.";
  });

  // Forgot password
  document.getElementById("forgot-link").addEventListener("click", (event) => {
    event.preventDefault();

    document.getElementById("login-message").textContent =
      "Password resets are not available yet.";
  });

  // Google authentication placeholder
  document.getElementById("google-button").addEventListener("click", () => {
    document.getElementById("login-message").textContent =
      "Continue with Google to sign in.";
  });
</script>

<script src="../src/js/config/config.js"></script>
<script src="../src/js/api.js"></script>
<script src="../src/js/auth.js"></script>
<script src="../src/js/integration.js"></script>
</body>
</html>

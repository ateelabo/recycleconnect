<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#15803d">
  <title>Administration | RecycleConnect</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-5 py-4">
      <a href="../index.html" class="flex items-center gap-2 font-bold text-slate-900"><span class="text-2xl">♻️</span> RecycleConnect</a>
      <div class="flex items-center gap-4"><span id="admin-name" class="text-sm font-medium">Administrator</span><button id="admin-logout" class="text-sm font-semibold text-green-700">Sign out</button></div>
    </div>
  </header>
  <main class="mx-auto max-w-6xl space-y-6 px-5 py-8">
    <section class="flex flex-wrap items-end justify-between gap-3">
      <div><p class="text-sm font-semibold uppercase tracking-wide text-green-700">Admin workspace</p><h1 class="mt-1 text-3xl font-bold text-slate-900">Operations overview</h1></div>
      <button id="admin-refresh" type="button" class="rounded-xl border border-slate-300 bg-white px-4 py-2 text-sm font-semibold">Refresh data</button>
    </section>
    <p id="admin-notice" class="rounded-xl bg-white p-4 text-sm text-slate-700" role="status" aria-live="polite">Loading admin data…</p>
    <section class="grid gap-4 sm:grid-cols-3">
      <article class="rounded-2xl border border-slate-200 bg-white p-5"><p class="text-sm text-slate-500">Completed today</p><p id="today-pickups" class="mt-2 text-2xl font-bold">—</p></article>
      <article class="rounded-2xl border border-slate-200 bg-white p-5"><p class="text-sm text-slate-500">Collected today</p><p id="today-kg" class="mt-2 text-2xl font-bold">—</p></article>
      <article class="rounded-2xl border border-slate-200 bg-white p-5"><p class="text-sm text-slate-500">Payouts today</p><p id="today-payouts" class="mt-2 text-2xl font-bold">—</p></article>
    </section>
    <section class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
      <h2 class="text-xl font-bold">Material rates</h2>
      <form id="rates-form" class="mt-4 grid gap-3 sm:grid-cols-4">
        <label class="text-sm font-medium">PET · ₦/kg<input id="rate-PET" type="number" min="0" step="1" required class="mt-1 w-full rounded-xl border border-slate-300 p-3"></label>
        <label class="text-sm font-medium">Cans · ₦/kg<input id="rate-CANS" type="number" min="0" step="1" required class="mt-1 w-full rounded-xl border border-slate-300 p-3"></label>
        <label class="text-sm font-medium">Cartons · ₦/kg<input id="rate-CARTONS" type="number" min="0" step="1" required class="mt-1 w-full rounded-xl border border-slate-300 p-3"></label>
        <label class="text-sm font-medium">Glass · ₦/kg<input id="rate-GLASS" type="number" min="0" step="1" required class="mt-1 w-full rounded-xl border border-slate-300 p-3"></label>
        <button class="rounded-xl bg-green-700 px-5 py-3 text-sm font-semibold text-white sm:col-span-4">Save rates</button>
      </form>
    </section>
    <section class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
      <h2 class="text-xl font-bold">Collector verification queue</h2>
      <div id="pending-collectors" class="mt-4 grid gap-3 md:grid-cols-2"><p class="text-sm text-slate-500">Loading collectors…</p></div>
    </section>
    <section class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
      <h2 class="text-xl font-bold">Pickup disputes</h2>
      <div id="admin-disputes" class="mt-4 grid gap-3 md:grid-cols-2"><p class="text-sm text-slate-500">Loading disputes…</p></div>
    </section>
  </main>
  <script src="../src/js/config/config.js"></script>
  <script src="../src/js/api.js"></script>
  <script src="../src/js/integration.js"></script>
</body>
</html>

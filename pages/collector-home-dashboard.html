<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f5f7f5">

  <link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/design-continuation.css">

<body class="rc-page"><main class="rc-phone">
  <div class="rc-status"><span data-current-time>9:30</span><span class="rc-island" aria-hidden="true"></span><span class="rc-status-right">▮▮▮　◉　▰</span></div>

  <p id="collector-notice" class="rc-small-note" role="status" aria-live="polite">Loading current pickups and rates…</p>
  <section id="collector-metrics" class="rc-metrics" aria-label="Live pickup totals"></section>
  <h2 class="rc-section-title">Current pickup queue</h2>
  <section id="collector-pickups" aria-live="polite"></section>
  <section class="rc-card" style="margin-top:12px"><h2>Quick actions</h2><button id="collector-refresh" class="rc-button secondary block" type="button">Refresh live data</button></section>
  <section class="rc-card" id="rates" style="margin-top:12px"><h2>Material rates</h2><div id="collector-rates" aria-live="polite">Loading live rates…</div></section>

  <nav class="rc-nav" aria-label="Collector navigation"><a class="active" href="./collector-home-dashboard.html"><span class="rc-nav-icon">⌂</span>Home</a><a href="#collector-pickups"><span class="rc-nav-icon">▣</span>My Job</a><a href="#rates"><span class="rc-nav-icon">▤</span>Rate</a><a href="#earnings"><span class="rc-nav-icon">◉</span>Earnings</a></nav>

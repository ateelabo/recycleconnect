
<!DOCTYPE html>

<body class="min-h-screen bg-gradient-to-br from-green-500 via-green-600 to-emerald-600 text-white">

      <a href="./login.html"

<!-- Google Sign In -->
<button
  type="button"
  id="google-signin"

>
  
<svg class="h-5 w-5" viewBox="0 0 48 48" aria-hidden="true">

    </section>

  <script>

if (role) {
  document.getElementById("selected-role").textContent =
    `Welcome, ${role}! Choose how to continue.`;
}

document.getElementById("google-signin").addEventListener("click", () => {
  // The shared integration script completes Google authentication with the backend.
});  </script>

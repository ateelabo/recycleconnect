<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15803d">
  <title>Dispute Resolution | RecycleConnect Admin</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-4 px-5 py-4">
      <a href="./admin-dashboard.html" class="flex items-center gap-2 font-bold text-slate-900"><span class="text-2xl">♻️</span> RecycleConnect <span class="font-normal text-slate-500">Admin</span></a>
      <nav class="flex flex-wrap items-center gap-2 text-sm font-semibold" aria-label="Admin navigation">
        <a href="./admin-dashboard.html" class="rounded-lg px-3 py-2 text-slate-600 hover:bg-slate-100">Overview &amp; rates</a>
        <a href="./admin-collectors.html" class="rounded-lg px-3 py-2 text-slate-600 hover:bg-slate-100">Collector verification</a>
        <a href="./admin-dispute.html" aria-current="page" class="rounded-lg bg-green-50 px-3 py-2 text-green-800">Disputes</a>
        <button id="admin-logout" class="rounded-lg px-3 py-2 text-slate-600 hover:bg-slate-100">Sign out</button>
      </nav>
    </div>
  </header>
  <main class="mx-auto max-w-7xl space-y-6 px-5 py-8">
    <section class="flex flex-wrap items-end justify-between gap-4">
      <div><p class="text-sm font-semibold uppercase tracking-wide text-green-700">Flow 3 · Admin Portal</p><h1 class="mt-1 text-3xl font-bold text-slate-900">Dispute resolution</h1><p class="mt-2 max-w-2xl text-sm text-slate-600">Review the household’s report, collection weights, payout, and scale evidence before resolving a dispute.</p></div>
      <button id="disputes-refresh" type="button" class="rounded-xl border border-slate-300 bg-white px-4 py-2 text-sm font-semibold">Refresh disputes</button>
    </section>
    <p id="disputes-notice" class="rounded-xl border border-slate-200 bg-white p-4 text-sm text-slate-700" role="status" aria-live="polite">Loading disputes…</p>
    <section id="admin-disputes" class="grid gap-5 xl:grid-cols-2" aria-live="polite"></section>
  </main>
  <script src="../src/js/config/config.js"></script>
  <script src="../src/js/api.js"></script>
  <script src="../src/js/admin-portal.js"></script>
</body>
</html>

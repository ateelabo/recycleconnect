<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15803d">
  <title>Admin Sign In | RecycleConnect</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
  <main class="flex min-h-screen items-center justify-center px-5 py-10">
    <section class="w-full max-w-md rounded-3xl border border-slate-200 bg-white p-7 shadow-sm sm:p-9">
      <a href="../index.html" class="flex items-center justify-center gap-2 text-lg font-bold text-slate-900"><span class="text-3xl">♻️</span> RecycleConnect</a>
      <p class="mt-7 text-center text-sm font-semibold uppercase tracking-wide text-green-700">Admin Portal</p>
      <h1 class="mt-2 text-center text-3xl font-bold text-slate-900">Sign in to operations</h1>
      <p class="mt-2 text-center text-sm text-slate-500">Use your administrator account to continue.</p>
      <form id="admin-login-form" class="mt-7 space-y-4" novalidate>
        <label class="block text-sm font-semibold" for="admin-identity">Email or phone number
          <input id="admin-identity" name="identity" type="text" autocomplete="username" required class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3 font-normal outline-none focus:border-green-600 focus:ring-2 focus:ring-green-100">
        </label>
        <label class="block text-sm font-semibold" for="admin-password">Password
          <input id="admin-password" name="password" type="password" autocomplete="current-password" required class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3 font-normal outline-none focus:border-green-600 focus:ring-2 focus:ring-green-100">
        </label>
        <p id="admin-login-message" class="min-h-5 text-sm text-slate-600" role="status" aria-live="polite"></p>
        <button class="w-full rounded-xl bg-green-700 px-5 py-3 font-semibold text-white transition hover:bg-green-800 focus:outline-none focus:ring-2 focus:ring-green-300" type="submit">Sign in</button>
      </form>
      <p class="mt-5 text-center text-xs text-slate-500">Admin accounts are provisioned by the project administrator.</p>
    </section>
  </main>
  <script src="../src/js/config/config.js"></script>
  <script src="../src/js/api.js"></script>
  <script>
    const api = window.RecycleConnectAPI;
    const form = document.getElementById("admin-login-form");
    const message = document.getElementById("admin-login-message");
    if (api.session().authenticated && api.session().role === "ADMIN") {
      location.replace("../pages/admin-dashboard.html");
    }
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "Signing in…";
      message.classList.remove("text-red-600");
      const button = form.querySelector("button[type=submit]");
      button.disabled = true;
      try {
        const result = await api.auth.login(
          document.getElementById("admin-identity").value.trim(),
          document.getElementById("admin-password").value
        );
        if (result.session.role !== "ADMIN") {
          api.signOut();
          throw new Error("This account does not have admin access.");
        }
        location.replace("../pages/admin-dashboard.html");
      } catch (error) {
        message.textContent = error.message || "Sign in failed. Try again.";
        message.classList.add("text-red-600");
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
